name: Publication calibration only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: agent-evaluation-live
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Sixteen bounded paid judgments on eight fixed cases
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node --import tsx scripts/eval-tasks/calibrate-publication.mjs --enable-paid --check --out test-results/publication-calibration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-calibration-${{ github.run_id }}
          path: test-results/
