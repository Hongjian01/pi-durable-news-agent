name: Reviewed feedback regressions only
on:
  workflow_dispatch:
    inputs:
      accept_paid_calls:
        description: 'Run two real regressions and same-model review. DeepSeek fees are outside the OpenRouter $1 credit cap.'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  feedback:
    if: inputs.accept_paid_calls && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: agent-evaluation-live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DNA_ENV_FILE: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Run only reviewed feedback regressions and track effects
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DNA_COST_ALERT_USD: '1'
        run: node scripts/eval-tasks/feedback-regressions.mjs --live --enable-paid --out test-results/feedback-regressions
      - name: Record assisted-review scope
        if: always()
        run: |
          echo 'Model-assisted exposed development regressions; humanReviewed=false; independent=false.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/feedback-regressions/campaign.json ]; then
            cat test-results/feedback-regressions/campaign.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-regressions-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
